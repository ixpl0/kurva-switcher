name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (Release, x64)
        run: msbuild kurva-switcher.sln /m /nologo /p:Configuration=Release /p:Platform=x64

      - name: Build (Debug, x64)
        run: msbuild kurva-switcher.sln /m /nologo /p:Configuration=Debug /p:Platform=x64

      - name: Run LayoutConverter tests
        run: |
          cl /nologo /std:c++20 /utf-8 /EHsc /W4 /Iinclude /Fe:LayoutConverterTest.exe tests\LayoutConverterTest.cpp src\LayoutConverter.cpp
          .\LayoutConverterTest.exe

      - uses: actions/upload-artifact@v4
        with:
          name: kurva-switcher-x64
          path: x64/Release/kurva-switcher.exe
